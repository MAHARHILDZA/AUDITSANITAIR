<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanitary Audit App</title>
    <link rel="manifest" href="./JSONFILE">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FIXED: Using .css extension for FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 50; display: flex; flex-direction: column; gap: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="toast-container"></div>

    <div class="max-w-6xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-lg shadow-sm mb-6">
            <h1 class="text-2xl font-bold text-blue-700 mb-2 sm:mb-0"><i class="fa-solid fa-droplet mr-2"></i>Sanitary Audit</h1>
            <div class="flex items-center space-x-4">
                <div id="statusIndicator" class="flex items-center space-x-2 bg-gray-50 px-3 py-1 rounded-full border">
                    <span id="statusDot" class="w-3 h-3 rounded-full bg-green-500"></span>
                    <span id="statusText" class="text-sm font-medium text-gray-700">Online</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form Input -->
            <div class="bg-white p-6 rounded-lg shadow-sm lg:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2" id="formTitle">New Data Input Form</h2>
                <form id="auditForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                            <input type="date" id="tanggal" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
                            <input type="time" id="jam" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Floor</label>
                        <input type="text" id="lantai" placeholder="Ex: 1st Floor" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Room</label>
                        <input type="text" id="ruangan" placeholder="Ex: Men's Toilet" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                            <select id="lokasi" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                                <option value="">-- Select --</option>
                                <option value="Kitchen sink">Kitchen Sink</option>
                                <option value="Washbasin">Washbasin</option>
                                <option value="Bidet">Bidet</option>
                                <option value="Shower">Shower</option>
                            </select>
                        </div>
                        <div>
                            <!-- FIXED: Sanitary Type changed to manual text input -->
                            <label class="block text-sm font-medium text-gray-700 mb-1">Sanitary Type</label>
                            <input type="text" id="tipeSanitair" placeholder="Ex: TOTO Faucet" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Brand and Type</label>
                        <input type="text" id="merk" placeholder="Ex: Toto T234" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4 border-t pt-4 mt-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Water Flow (ml)</label>
                            <input type="number" id="debit" step="any" placeholder="0" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Measurement Duration (sec)</label>
                            <input type="number" id="waktu" step="any" placeholder="0" class="w-full border-gray-300 rounded-md shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                    </div>

                    <div class="bg-blue-50 p-3 rounded-md border border-blue-100 mt-2">
                        <label class="block text-sm font-semibold text-blue-800 mb-1">Result: Liters per Minute</label>
                        <input type="text" id="lpm" class="w-full bg-transparent border-none text-xl font-bold text-blue-700 p-0 focus:ring-0" readonly placeholder="0.00">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="btnSubmit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                            <i class="fa-solid fa-plus mr-2"></i>Add Data
                        </button>
                        <button type="button" id="btnBatal" class="hidden flex-1 bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                            Cancel Edit
                        </button>
                    </div>
                </form>
            </div>

            <!-- Table View -->
            <div class="bg-white p-6 rounded-lg shadow-sm lg:col-span-2">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                    <h2 class="text-lg font-semibold">Audit Data</h2>
                    
                    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                        <div class="relative w-full sm:w-64">
                            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400"></i>
                            <input type="text" id="searchInput" placeholder="Search data..." class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div class="flex gap-2 w-full sm:w-auto">
                            <input type="file" id="importCsv" accept=".csv" class="hidden">
                            <button id="btnImport" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-3 rounded-md text-sm transition duration-200" onclick="document.getElementById('importCsv').click()">
                                <i class="fa-solid fa-file-import mr-1"></i> Import
                            </button>
                            <button id="btnExport" class="flex-1 sm:flex-none bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-3 rounded-md text-sm transition duration-200">
                                <i class="fa-solid fa-file-export mr-1"></i> Export CSV
                            </button>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto border rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">No</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Time</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Room Location</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Sanitary Details</th>
                                <th class="px-4 py-3 text-right font-medium text-gray-500 uppercase">L/min</th>
                                <th class="px-4 py-3 text-center font-medium text-gray-500 uppercase">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Table rows are rendered via JS -->
                        </tbody>
                    </table>
                    <div id="emptyState" class="hidden p-8 text-center text-gray-500">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-gray-300"></i>
                        <p>No audit data stored yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PWA Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./JSFILE').catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }

        // State & Variables
        let auditData = JSON.parse(localStorage.getItem('auditData_v2')) || [];
        let editId = null;

        // DOM Elements
        const form = document.getElementById('auditForm');
        const inputDebit = document.getElementById('debit');
        const inputWaktu = document.getElementById('waktu');
        const inputLPM = document.getElementById('lpm');
        const searchInput = document.getElementById('searchInput');
        const importCsvInput = document.getElementById('importCsv');

        // Online/Offline Indicator
        function updateOnlineStatus() {
            const isOnline = navigator.onLine;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (isOnline) {
                dot.className = 'w-3 h-3 rounded-full bg-green-500';
                text.textContent = 'Online';
            } else {
                dot.className = 'w-3 h-3 rounded-full bg-red-500';
                text.textContent = 'Offline (Local Data)';
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-md shadow-lg flex items-center gap-3 transition-opacity duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fix Timezone: Set Local Time (Device Time)
        function setDefaultDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('tanggal').value = `${year}-${month}-${day}`;
            document.getElementById('jam').value = `${hours}:${minutes}`;
        }

        // Auto Calculate L/min
        function calculateLPM() {
            const debit = parseFloat(inputDebit.value);
            const waktu = parseFloat(inputWaktu.value);
            
            if (debit < 0 || waktu <= 0) {
                inputLPM.value = '';
                if (inputDebit.value !== '' && inputWaktu.value !== '') {
                    showToast('Flow cannot be negative and Duration must be greater than 0', 'error');
                }
                return;
            }

            if (!isNaN(debit) && !isNaN(waktu) && waktu > 0) {
                const liter = debit / 1000;
                const menit = waktu / 60;
                const lpm = liter / menit;
                inputLPM.value = lpm.toFixed(2);
            } else {
                inputLPM.value = '';
            }
        }

        inputDebit.addEventListener('input', calculateLPM);
        inputWaktu.addEventListener('input', calculateLPM);

        // Render Data Table
        function renderTable(filterText = '') {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';
            
            const filteredData = auditData.filter(d => {
                const searchStr = `${d.lantai} ${d.ruangan} ${d.lokasi} ${d.tipeSanitair} ${d.merk}`.toLowerCase();
                return searchStr.includes(filterText.toLowerCase());
            });

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredData.forEach((data, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-gray-500">${index + 1}</td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="font-medium text-gray-900">${data.tanggal}</div>
                            <div class="text-xs text-gray-500">${data.jam}</div>
                        </td>
                        <td class="px-4 py-3">
                            <div class="font-medium text-gray-900">${data.ruangan}</div>
                            <div class="text-xs text-gray-500">Floor: ${data.lantai}</div>
                        </td>
                        <td class="px-4 py-3">
                            <div class="text-gray-900"><span class="font-medium">${data.lokasi}</span> - ${data.tipeSanitair}</div>
                            <div class="text-xs text-gray-500">Brand: ${data.merk}</div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-right font-bold ${parseFloat(data.lpm) > 10 ? 'text-red-600' : 'text-green-600'}">
                            ${data.lpm}
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-center">
                            <button onclick="editData('${data.id}')" class="text-blue-600 hover:text-blue-900 mx-1" title="Edit">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteData('${data.id}')" class="text-red-600 hover:text-red-900 mx-1" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // Submit Form (Add / Update)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Re-eval validation
            const debitVal = parseFloat(inputDebit.value);
            const waktuVal = parseFloat(inputWaktu.value);
            if (debitVal < 0 || waktuVal <= 0) {
                showToast('Failed: Invalid measurement duration', 'error');
                return;
            }

            const newData = {
                id: editId || Date.now().toString(),
                tanggal: document.getElementById('tanggal').value,
                jam: document.getElementById('jam').value,
                lantai: document.getElementById('lantai').value,
                ruangan: document.getElementById('ruangan').value,
                lokasi: document.getElementById('lokasi').value,
                tipeSanitair: document.getElementById('tipeSanitair').value,
                merk: document.getElementById('merk').value,
                debit: inputDebit.value,
                waktu: inputWaktu.value,
                lpm: inputLPM.value
            };

            if (editId) {
                const index = auditData.findIndex(d => d.id === editId);
                auditData[index] = newData;
                showToast('Data successfully updated!');
            } else {
                auditData.push(newData);
                showToast('New data successfully added!');
            }

            localStorage.setItem('auditData_v2', JSON.stringify(auditData));
            resetFormMode();
            renderTable(searchInput.value);
        });

        // Edit Data
        window.editData = (id) => {
            const data = auditData.find(d => d.id === id);
            if (!data) return;

            editId = id;
            document.getElementById('tanggal').value = data.tanggal;
            document.getElementById('jam').value = data.jam;
            document.getElementById('lantai').value = data.lantai;
            document.getElementById('ruangan').value = data.ruangan;
            document.getElementById('lokasi').value = data.lokasi;
            document.getElementById('tipeSanitair').value = data.tipeSanitair || '';
            document.getElementById('merk').value = data.merk;
            document.getElementById('debit').value = data.debit;
            document.getElementById('waktu').value = data.waktu;
            document.getElementById('lpm').value = data.lpm;

            document.getElementById('formTitle').textContent = "Edit Audit Data";
            document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-save mr-2"></i>Update Data';
            document.getElementById('btnSubmit').className = "flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-medium py-2 px-4 rounded-md transition duration-200";
            document.getElementById('btnBatal').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Cancel Edit
        document.getElementById('btnBatal').addEventListener('click', () => {
            if(confirm('Are you sure you want to cancel the edit? Unsaved changes will be lost.')) {
                resetFormMode();
            }
        });

        function resetFormMode() {
            editId = null;
            form.reset();
            setDefaultDateTime();
            document.getElementById('lpm').value = '';
            document.getElementById('formTitle').textContent = "New Data Input Form";
            document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-plus mr-2"></i>Add Data';
            document.getElementById('btnSubmit').className = "flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200";
            document.getElementById('btnBatal').classList.add('hidden');
        }

        // Delete Data
        window.deleteData = (id) => {
            if (confirm('Are you sure you want to delete this data?')) {
                auditData = auditData.filter(d => d.id !== id);
                localStorage.setItem('auditData_v2', JSON.stringify(auditData));
                renderTable(searchInput.value);
                showToast('Data successfully deleted');
            }
        };

        // Real-time Search
        searchInput.addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        // Export CSV
        document.getElementById('btnExport').addEventListener('click', () => {
            if (auditData.length === 0) {
                showToast('No data to export', 'error');
                return;
            }

            const headers = ["No", "Date", "Time", "Floor", "Room", "Location", "Sanitary Type", "Brand and Type", "Water Flow (ml)", "Duration (s)", "liters per minute"];
            
            const csvRows = [];
            csvRows.push(headers.join(','));

            auditData.forEach((data, index) => {
                const row = [
                    index + 1,
                    data.tanggal,
                    data.jam,
                    `"${data.lantai}"`,
                    `"${data.ruangan}"`,
                    `"${data.lokasi}"`,
                    `"${data.tipeSanitair || ''}"`,
                    `"${data.merk}"`,
                    data.debit,
                    data.waktu,
                    data.lpm
                ];
                csvRows.push(row.join(','));
            });

            const csvString = csvRows.join('\n');
            const blob = new Blob([csvString], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Sanitary_Audit_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Import CSV with Regex Parsing to handle commas inside quotes
        importCsvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const rows = text.split('\n').filter(row => row.trim() !== '');
                
                if (rows.length <= 1) {
                    showToast('CSV file is empty or invalid format', 'error');
                    importCsvInput.value = '';
                    return;
                }

                let importedCount = 0;
                
                for (let i = 1; i < rows.length; i++) {
                    const rowText = rows[i];
                    // Regex to split by commas but ignore commas inside quotes
                    const matches = rowText.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || rowText.split(',');
                    
                    const cleanCell = (val) => val ? val.replace(/^"|"$/g, '').trim() : '';
                    
                    if (matches.length >= 10) {
                        const newData = {
                            id: Date.now().toString() + i,
                            tanggal: cleanCell(matches[1]),
                            jam: cleanCell(matches[2]),
                            lantai: cleanCell(matches[3]),
                            ruangan: cleanCell(matches[4]),
                            lokasi: cleanCell(matches[5]),
                            tipeSanitair: cleanCell(matches[6]),
                            merk: cleanCell(matches[7]),
                            debit: cleanCell(matches[8]),
                            waktu: cleanCell(matches[9]),
                            lpm: cleanCell(matches[10] || '0')
                        };
                        auditData.push(newData);
                        importedCount++;
                    }
                }

                if (importedCount > 0) {
                    localStorage.setItem('auditData_v2', JSON.stringify(auditData));
                    renderTable(searchInput.value);
                    showToast(`${importedCount} data rows successfully imported!`);
                } else {
                    showToast('Failed to process CSV data rows', 'error');
                }
                importCsvInput.value = ''; // reset input
            };
            reader.readAsText(file);
        });

        // Initialization
        setDefaultDateTime();
        renderTable();
    </script>
</body>
</html>
